name: Push (CI)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Install NPM Packages
        run: npm run npm:clean-install
      - name: Typecheck (Web)
        run: npm run check:ts --workspace=web
      - name: Typecheck (Electron)
        run: npm run check:ts --workspace=app/electron
      - name: Typecheck (NW.js)
        run: npm run check:ts --workspace=app/nw
      - name: Build Web Application
        run: npm run build --workspace=web
      - name: Build Electron Application
        run: npm run build --workspace=app/electron
