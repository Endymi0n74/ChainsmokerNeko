name: Push (CI)

on:
  push:
    # Doc-only commits don't need the full build + bundles + nightly pipeline.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'MEMORY.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Verify Manifest Versions
        run: npm run check:versions
      - name: Cache NPM Packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Cache Electron Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('app/electron/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: Configure Git (HTTPS)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install NPM Packages
        run: npm ci
      - name: Typecheck (Web)
        run: npm run check:ts --workspace=web
      - name: Lint (Web)
        run: npm run check:lint --workspace=web
      - name: Svelte Check (Web)
        run: npm run check:svelte --workspace=web
      - name: Vue Type Check (Web)
        run: npm run check:vue --workspace=web
      - name: Typecheck & Lint (Electron)
        run: npm run check --workspace=app/electron
      - name: Typecheck & Lint (NW.js)
        run: npm run check --workspace=app/nw
      - name: Build Web Application
        run: npm run build --workspace=web
      - name: Build Electron Application
        run: npm run build --workspace=app/electron
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-build
          path: app/electron/build
          if-no-files-found: error

  bundles:
    name: Build Windows bundles (ia32 / x64 / arm64)
    needs: ci
    runs-on: windows-latest
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Cache Electron Distributions
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-zips
          key: electron-zips-${{ runner.os }}-${{ hashFiles('app/electron/package.json') }}
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: app/electron/build
      - name: Install NSIS (Windows installer)
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Create Windows Bundles
        working-directory: app/electron
        env:
          HAKUNEKO_ELECTRON_CACHE: ${{ runner.temp }}/electron-zips
        run: node ./scripts/deploy-app.mjs
      - name: Upload Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: app/electron/bundle/*
          if-no-files-found: error

  release:
    name: Publish rolling 'nightly' release
    needs: bundles
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Bundle Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: bundle
      - name: Publish 'nightly' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete --repo ${{ github.repository }} nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create --repo ${{ github.repository }} nightly \
            --title "Nightly build ${{ github.sha }}" \
            --latest=false \
            --notes "Automated build from commit ${{ github.sha }}. Windows portable zips + NSIS installer (x64 / ia32 / arm64). 'latest' stays reserved for tagged releases." \
            bundle/*
