name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.0). Leave empty to use the version from app/electron/package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Electron (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Cache Electron Distributions
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-zips
          key: electron-zips-${{ runner.os }}-${{ hashFiles('app/electron/package.json') }}
      - name: Install NPM Packages
        env:
          electron_config_cache: ${{ runner.temp }}/electron-zips
        run: npm ci
      - name: Install NSIS (Windows installer)
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Install Snapcraft (Linux snap)
        if: matrix.target == 'linux'
        run: sudo snap install snapcraft --classic
      - name: Build Web Application
        run: npm run build --workspace=web
      - name: Bundle Electron Application
        env:
          HAKUNEKO_ELECTRON_CACHE: ${{ runner.temp }}/electron-zips
        run: npm run bundle --workspace=app/electron
      - name: Upload Bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: app/electron/bundle/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Determine version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./app/electron/package.json').version")
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$PKG_VERSION"
          fi
          # Normalize a leading 'v' so tags stay consistent with previous releases (e.g. '2.0.0').
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          # The bundles are stamped with the package version, so refuse to publish a tag
          # that does not match it - bump the package.json versions before releasing.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version '$VERSION' does not match app/electron/package.json version '$PKG_VERSION'. Bump the package versions first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - "$VERSION" > notes.md <<'EOF'
          const fs = require('node:fs');
          const version = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const header = '## [' + version + ']';
          const start = changelog.indexOf(header);
          let notes;
          if (start < 0) {
            notes = changelog;
          } else {
            const end = changelog.indexOf('\n## [', start + header.length);
            notes = changelog.slice(start, end < 0 ? undefined : end);
          }
          process.stdout.write(notes.trim() + '\n');
          EOF
      - name: Download Bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Release already exists (e.g. Windows bundles published manually):
            # attach the OS bundles to it instead of failing on the existing tag.
            echo "Release $VERSION already exists — uploading bundles to it."
            gh release upload "$VERSION" artifacts/bundles-windows/* artifacts/bundles-macos/* artifacts/bundles-linux/* --clobber
          else
            gh release create "$VERSION" \
              --title "ChainsmokerNeko $VERSION" \
              --notes-file notes.md \
              --latest \
              artifacts/bundles-windows/* \
              artifacts/bundles-macos/* \
              artifacts/bundles-linux/*
          fi
