name: Release Windows Bundles

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows bundles (ia32 / x64 / arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout ${{ github.repository }} @ ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Cache NPM Packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Configure Git (HTTPS)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install NPM Packages
        run: npm ci
      - name: Build Web Application
        run: npm run build --workspace=web
      - name: Build Electron Application
        run: npm run build --workspace=app/electron
      - name: Create Windows Bundles
        working-directory: app/electron
        run: node ./scripts/deploy-app.mjs
      - name: Upload Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: app/electron/bundle/*.zip
          if-no-files-found: error

  release:
    name: Publish rolling 'nightly' release
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Bundle Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: bundle
      - name: Publish 'nightly' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --title "Nightly build ${{ github.sha }}" \
            --latest=false \
            --notes "Automated build from commit ${{ github.sha }}. Windows x64 / ia32 / arm64. 'latest' stays reserved for tagged releases." \
            bundle/*.zip
